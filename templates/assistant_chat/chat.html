{% load static %}
<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistent IA – StreamEvents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { padding-top: 70px; background: #f8f9fa; }
    #chat-box {
      height: 460px;
      overflow-y: auto;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 1rem;
      background: #ffffff;
    }
    .bubble-user {
      background: #0d6efd;
      color: white;
      border-radius: 16px 16px 4px 16px;
      padding: 8px 14px;
      display: inline-block;
      max-width: 80%;
    }
    .bubble-assistant {
      background: #f1f3f5;
      border: 1px solid #dee2e6;
      border-radius: 16px 16px 16px 4px;
      padding: 8px 14px;
      display: inline-block;
      max-width: 90%;
    }
    .event-card {
      border-left: 4px solid #0d6efd;
    }
  </style>
</head>
<body>

{% include 'includes/navbar.html' %}

<div class="container py-4" style="max-width:720px;">
  <h2 class="mb-1"><i class="fas fa-robot"></i> Assistent d'esdeveniments</h2>
  <p class="text-muted mb-3">Pregunta'm quins esdeveniments t'interessen i te'n recomanaré.</p>

  <div id="chat-box" class="mb-3"></div>

  <div class="input-group mb-2">
    <input id="msg" type="text" class="form-control"
           placeholder="Ex: vull un concert de jazz aquest cap de setmana">
    <button id="send" class="btn btn-primary">
      <i class="fas fa-paper-plane"></i> Enviar
    </button>
  </div>

  <div class="form-check">
    <input class="form-check-input" type="checkbox" id="onlyFuture" checked>
    <label class="form-check-label" for="onlyFuture">Només esdeveniments futurs</label>
  </div>
</div>

<script>
  const chatBox = document.getElementById("chat-box");

  function appendMessage(role, html) {
    const wrapper = document.createElement("div");
    wrapper.className = "d-flex mb-3 " + (role === "user" ? "justify-content-end" : "justify-content-start");
    const bubble = document.createElement("div");
    bubble.className = role === "user" ? "bubble-user" : "bubble-assistant";
    bubble.innerHTML = html;
    wrapper.appendChild(bubble);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function renderCards(events) {
    if (!events || !events.length) return "";
    let html = '<div class="mt-2">';
    events.forEach(ev => {
      const date = ev.scheduled_date ? new Date(ev.scheduled_date).toLocaleString('ca') : "—";
      html += `
        <div class="card event-card mb-2 p-2">
          <a href="${ev.url}" class="fw-bold text-decoration-none">${ev.title}</a>
          <div class="text-muted small">${ev.category} · ${date}</div>
          ${ev.tags ? `<div class="small text-secondary">#${ev.tags.replace(/,/g, ' #')}</div>` : ""}
        </div>`;
    });
    html += '</div>';
    return html;
  }

  async function send() {
    const message = document.getElementById("msg").value.trim();
    if (!message) return;

    const onlyFuture = document.getElementById("onlyFuture").checked;
    document.getElementById("msg").value = "";

    appendMessage("user", message);
    appendMessage("assistant", '<span class="text-muted"><i class="fas fa-spinner fa-spin"></i> Pensant...</span>');

    try {
      const res = await fetch("/assistant/api/chat/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, only_future: onlyFuture })
      });
      const data = await res.json();

      const bubbles = chatBox.querySelectorAll(".bubble-assistant");
      const last = bubbles[bubbles.length - 1];

      let html = `<div>${data.answer || ""}</div>`;
      html += renderCards(data.events);
      if (data.follow_up) {
        html += `<div class="mt-2 text-muted small"><i class="fas fa-question-circle"></i> ${data.follow_up}</div>`;
      }
      last.innerHTML = html;

    } catch (err) {
      const bubbles = chatBox.querySelectorAll(".bubble-assistant");
      const last = bubbles[bubbles.length - 1];
      last.innerHTML = '<span class="text-danger">Error de connexió amb el servidor.</span>';
    }
  }

  document.getElementById("send").addEventListener("click", send);
  document.getElementById("msg").addEventListener("keydown", e => {
    if (e.key === "Enter") send();
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
